releaseNotes: This hotfix improves the reliability of macOS deployments
  distributed as a PKG through Microsoft Intune. Previously, Intune could
  misread the installer package and think the client needed to be reinstalled,
  briefly interrupting connectivity when it did. The client is now detected
  correctly after installation and stays put between evaluation cycles.
